<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Gray Retu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="../css/retu.css?v=1.0.1">
</head>
<body>
    <header>
        <div class="logo">GRAY <span>RETU</span></div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <a href="contact.html" class="btn" style="padding: 10px 20px; font-size: 13px;">Book Table</a>
    </header>

    <section>
        <h2 class="section-title" data-aos="fade-up">Get In Touch</h2>
        <div class="contact-container" data-aos="zoom-in">
            <div class="contact-info" data-aos="fade-right">
                <h3 style="color: var(--accent); margin-bottom: 25px;">Contact Information</h3>
                <p style="margin-bottom: 15px;">📍 Shyamoli, Adabor, Dhaka-1207</p>
                <p style="margin-bottom: 15px;">📞 +880 123 456 789</p>
                <p style="margin-bottom: 15px;">✉️ info@grayretu.com</p>
                <br>
                <h3 style="color: var(--accent); margin-top:20px; margin-bottom: 20px;">Open Hours</h3>
                <p>Mon - Sat: 11:00 AM - 11:00 PM</p>
                <p>Sunday: 12:00 PM - 10:00 PM</p>
            </div>
            <div class="contact-form-div" data-aos="fade-left">
                <form id="contactForm">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="Tell us something..."></textarea>
                    </div>
                    <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script src="../js/retu.js"></script>
</body>
</html>
