<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body>
    <header>
        <div class="logo">GRAY <span>RETU</span></div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <a href="contact.html" class="btn" style="padding: 10px 20px; font-size: 13px;">Book Table</a>
    </header>

    <section>
        <h2 class="section-title" data-aos="fade-up">Culinary Gallery</h2>
        <div class="grid">
            <div class="card" data-aos="zoom-in" data-aos-delay="100">
                <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=600&auto=format&fit=crop" alt="Grill">
            </div>
            <div class="card" data-aos="zoom-in" data-aos-delay="200">
                <img src="https://thumbs.dreamstime.com/b/confit-duck-leg-flageolet-ragout-celeriac-mash-30595326.jpg?w=768" alt="Pancakes">
            </div>
            <div class="card" data-aos="zoom-in" data-aos-delay="300">
                <img src="https://images.unsplash.com/photo-1482049016688-2d3e1b311543?q=80&w=600&auto=format&fit=crop" alt="Avocado Toast">
            </div>
            <div class="card" data-aos="zoom-in" data-aos-delay="400">
                <img src="https://images.unsplash.com/photo-1467003909585-2f8a72700288?q=80&w=600&auto=format&fit=crop" alt="Fish">
            </div>
            <div class="card" data-aos="zoom-in" data-aos-delay="500">
                <img src="https://thumbs.dreamstime.com/b/roast-duck-12256787.jpg?w=768" alt="Steak">
            </div>
            <div class="card" data-aos="zoom-in" data-aos-delay="600">
                <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?q=80&w=600&auto=format&fit=crop" alt="Salad 2">
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script src="../js/retu.js"></script>
